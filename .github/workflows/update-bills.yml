name: Update Korean Assembly bill briefs

on:
  schedule:
    # Daily at 07:20 KST / 22:20 UTC. GitHub schedules may be delayed.
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch and summarize recent passed bills
        run: python scripts/update_bills.py
      - name: Commit updated digest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Korean Assembly bill digest"
          file_pattern: data/bills.json
